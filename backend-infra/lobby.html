<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Legal Segura</title>
    <style>
        /* Diseño Corporativo Minimalista */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background-color: #004085;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
            font-weight: bold;
        }
        h2 { margin-top: 0; color: #004085; font-size: 22px; }
        p { color: #666; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
        
        /* El iFrame que contiene el motor (Lo dejamos visible temporalmente para pruebas) */
        .mumble-container {
            width: 100%;
            height: 350px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .footer-text { font-size: 12px; color: #aaa; margin-top: 20px;}
    </style>
</head>
<body>

    <div class="card">
        <!-- Puedes cambiar esto por el logo real de los abogados -->
        <div class="logo-placeholder">⚖️</div>
        
        <h2>Sala de Consulta Privada</h2>
        <p>Conexión encriptada de extremo a extremo. Ingrese su nombre en el panel inferior y presione "Connect" para hablar con su abogado.</p>
        
        <!-- Aquí encapsulamos la interfaz fea para controlarla -->
        <div class="mumble-container">
            <iframe id="motorAudio" src="http://localhost:8090" allow="microphone"></iframe>
        </div>

        <div class="footer-text">
            Plataforma de comunicación segura.
        </div>
    </div>

</body>
</html>
